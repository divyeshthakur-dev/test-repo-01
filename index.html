<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home Page</title>
    <style>
        /* Basic reset and layout styling to ensure proper centering */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            background-color: #f4f4f9;
            color: #333;
        }
        header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem 2rem;
            text-align: center;
        }
        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }
        .hero-section h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            color: #2c3e50;
        }
        .hero-section p {
            font-size: 1.2rem;
            color: #666;
            margin-bottom: 1.5rem;
        }
        .btn {
            display: inline-block;
            background-color: #3498db;
            color: white;
            padding: 0.75rem 1.5rem;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
        }
        .btn:hover {
            background-color: #2980b9;
        }
        footer {
            background-color: #2c3e50;
            color: white;
            text-align: center;
            padding: 1rem;
        }
    </style>
</head>
<body>
    <!-- Header Section -->
    <header>
        <h2>My Navbar</h2>
    </header>

    <!-- Center Home Page Content -->
    <main>
        <section class="hero-section">
            <h1>Welcome to Home Page</h1>
            <p>Discover amazing content and explore what we have to offer.</p>
            <a href="#" class="btn">Let's Get Started</a>
        </section>
    </main>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2026 My Footer. All rights reserved.</p>
    </footer>
</body>
</html>
